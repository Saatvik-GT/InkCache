name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Least-privilege default: this job only reads the repo, installs deps, and
# runs tests/lint/build -- it never comments on PRs, creates releases, or
# pushes anywhere, so it has no legitimate use for GITHUB_TOKEN write access.
# Without this, GITHUB_TOKEN gets whatever the repo's default token
# permissions are (read/write on many repos), which a compromised or
# tampered third-party action would inherit for no reason. The Docker
# layer cache (cache-to: type=gha) uses its own separately-provisioned
# runtime token, not GITHUB_TOKEN, so this doesn't affect it.
permissions:
  contents: read

# Cancel a still-running CI run for the same branch/PR when a newer push
# arrives -- without this, pushing three commits in a row runs the whole
# job (including the Docker build + smoke test) three times to completion.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    # Without this, a genuinely hung step (a stuck install, a Docker pull
    # that never completes) runs until GitHub's default 360-minute cap
    # instead of failing fast. Generous relative to how long this job
    # actually takes.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          # Without this, cache: npm only keys off the root lockfile --
          # the dashboard's own (much larger) npm ci below got zero cache
          # benefit and reinstalled React/Vite/TypeScript/oxlint from
          # scratch on every run.
          cache-dependency-path: |
            package-lock.json
            src/dashboard/package-lock.json

      - name: Install backend deps
        run: npm ci

      # Must run before the backend typecheck/test steps below: the root
      # tsconfig's tests/**/* transitively pulls in dashboard lib code
      # (tests/log.test.ts -> src/dashboard/src/lib/log.ts -> sound.ts,
      # which needs @types/react for useSyncExternalStore's signature).
      # @types/react only exists once src/dashboard's own deps are
      # installed -- running typecheck/test first fails with "Cannot find
      # module 'react'" on a clean checkout, caught live when this was
      # still ordered after them.
      - name: Install dashboard deps
        run: npm ci
        working-directory: src/dashboard

      - name: Typecheck backend
        run: npm run typecheck

      - name: Check formatting
        run: npm run format:check

      - name: Run core + API tests
        run: npm test

      - name: Lint dashboard
        run: npm run lint
        working-directory: src/dashboard

      - name: Build dashboard
        run: npm run build
        working-directory: src/dashboard

      - uses: docker/setup-buildx-action@v3

      # Plain `docker build` has no cache across CI runs -- every run
      # rebuilt every layer, including npm ci --omit=dev, from scratch.
      # GHA-backed cache persists layers between runs; load: true keeps
      # the image in the local Docker daemon so the smoke test below can
      # still `docker run` it directly, same as before.
      - name: Build node Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          tags: inkcache-node
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke-test the Docker image
        run: |
          docker run -d --name inkcache-smoke -p 8080:8080 \
            -e INKCACHE_PERSIST_PATH=/tmp/inkcache.json \
            inkcache-node
          for i in $(seq 1 10); do
            if curl -sf http://localhost:8080/health; then break; fi
            [ "$i" -eq 10 ] && { echo "node never came up"; docker logs inkcache-smoke; exit 1; }
            sleep 1
          done

      # `docker stop` sends a real SIGTERM (SIGKILL only after a grace
      # period) on a real POSIX target -- the one code path that could
      # never be verified from a Windows dev machine, where neither
      # Stop-Process nor taskkill deliver a signal server.ts's own
      # process.on("SIGTERM") can actually catch. `node` is PID 1 in the
      # container directly (no npx wrapper since the multi-stage build
      # ships precompiled JS), so there's no intermediary that could
      # swallow the signal instead of forwarding it.
      - name: Verify graceful shutdown and the persistence final-save
        run: |
          curl -sf -X POST http://localhost:8080/set \
            -H "Content-Type: application/json" \
            -d '{"key":"smoke-test","value":"1"}'
          docker stop inkcache-smoke
          docker logs inkcache-smoke 2>&1 | grep -q "received SIGTERM, shutting down" || {
            echo "graceful shutdown log line never appeared -- SIGTERM isn't reaching the process"
            docker logs inkcache-smoke
            exit 1
          }
          docker cp inkcache-smoke:/tmp/inkcache.json ./persisted-smoke-test.json
          grep -q "smoke-test" ./persisted-smoke-test.json || {
            echo "persisted file is missing the seeded key -- final save on shutdown didn't run"
            cat ./persisted-smoke-test.json
            exit 1
          }

      # Runs even if either step above failed (if: always()) — a failed
      # health check or shutdown check would otherwise leave the container
      # running for the rest of the job instead of exiting cleanly.
      - name: Stop the smoke-test container
        if: always()
        run: docker rm -f inkcache-smoke
