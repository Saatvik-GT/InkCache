name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel a still-running CI run for the same branch/PR when a newer push
# arrives -- without this, pushing three commits in a row runs the whole
# job (including the Docker build + smoke test) three times to completion.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    # Without this, a genuinely hung step (a stuck install, a Docker pull
    # that never completes) runs until GitHub's default 360-minute cap
    # instead of failing fast. Generous relative to how long this job
    # actually takes.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          # Without this, cache: npm only keys off the root lockfile --
          # the dashboard's own (much larger) npm ci below got zero cache
          # benefit and reinstalled React/Vite/TypeScript/oxlint from
          # scratch on every run.
          cache-dependency-path: |
            package-lock.json
            src/dashboard/package-lock.json

      - name: Install backend deps
        run: npm ci

      - name: Typecheck backend
        run: npm run typecheck

      - name: Check formatting
        run: npm run format:check

      - name: Run core + API tests
        run: npm test

      - name: Install dashboard deps
        run: npm ci
        working-directory: src/dashboard

      - name: Lint dashboard
        run: npm run lint
        working-directory: src/dashboard

      - name: Build dashboard
        run: npm run build
        working-directory: src/dashboard

      - uses: docker/setup-buildx-action@v3

      # Plain `docker build` has no cache across CI runs -- every run
      # rebuilt every layer, including npm ci --omit=dev, from scratch.
      # GHA-backed cache persists layers between runs; load: true keeps
      # the image in the local Docker daemon so the smoke test below can
      # still `docker run` it directly, same as before.
      - name: Build node Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          tags: inkcache-node
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke-test the Docker image
        run: |
          docker run -d --name inkcache-smoke -p 8080:8080 inkcache-node
          for i in $(seq 1 10); do
            if curl -sf http://localhost:8080/health; then break; fi
            [ "$i" -eq 10 ] && { echo "node never came up"; docker logs inkcache-smoke; exit 1; }
            sleep 1
          done

      # Runs even if the smoke test above failed (if: always()) — a failed
      # health check would otherwise leave the container running for the
      # rest of the job instead of exiting cleanly.
      - name: Stop the smoke-test container
        if: always()
        run: docker rm -f inkcache-smoke
